name: Secure CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ------------------------------------------------------------------
  # STAGE 1 : Scan de secrets (credentials codés en dur)
  # ------------------------------------------------------------------
  secret-scan:
    name: Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true

  # ------------------------------------------------------------------
  # STAGE 2 : SAST - analyse statique du code
  # ------------------------------------------------------------------
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          semgrep scan --config p/owasp-top-ten --config p/python \
            --json --output semgrep-results.json .
        continue-on-error: true

      - name: Upload SAST results
        uses: actions/upload-artifact@v4
        with:
          name: sast-results
          path: semgrep-results.json

  # ------------------------------------------------------------------
  # STAGE 3 : SCA - vulnérabilités dans les dépendances (CVE / NVD)
  # ------------------------------------------------------------------
  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        id: depcheck
        with:
          project: "secure-ci-project"
          path: "./app"
          format: "JSON"
          args: >
            --failOnCVSS 0
            --enableRetired

      - name: Upload SCA results
        uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: ${{ github.workspace }}/reports/dependency-check-report.json

  # ------------------------------------------------------------------
  # STAGE 4 : Container scan (image Docker)
  # ------------------------------------------------------------------
  container-scan:
    name: Container Scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t secure-ci-project:latest .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "secure-ci-project:latest"
          format: "json"
          output: "trivy-results.json"
          severity: "CRITICAL,HIGH,MEDIUM"
        continue-on-error: true

      - name: Upload container scan results
        uses: actions/upload-artifact@v4
        with:
          name: container-results
          path: trivy-results.json

  # ------------------------------------------------------------------
  # STAGE 5 : Quality Gate - agrège tout et décide du pass/fail
  # ------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, sca, container-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Download all scan results
        uses: actions/download-artifact@v4
        with:
          path: scan-results

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Evaluate Quality Gate
        run: python3 quality_gate.py --results-dir scan-results

      - name: Post summary to PR
        if: always()
        run: cat quality_gate_summary.md >> $GITHUB_STEP_SUMMARY
